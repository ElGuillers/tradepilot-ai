services:
  # Backend API + Autonomous 24/7 Scanner
  - type: web
    name: tradepilot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: TELEGRAM_AUTO_ALERTS
        value: "True"
      - key: TELEGRAM_MIN_SCORE
        value: "70.0"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./tradepilot.db

  # Frontend React SPA
  - type: web
    name: tradepilot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
