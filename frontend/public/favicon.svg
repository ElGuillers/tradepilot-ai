<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="16" fill="url(#tp-grad)" />
  
  <!-- Subtle overlay border -->
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />
  
  <!-- Trading Candlestick Bullish Bar -->
  <line x1="22" y1="14" x2="22" y2="48" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
  <rect x="18" y="22" width="8" height="18" rx="2" fill="#ffffff" fill-opacity="0.35"/>

  <!-- Main Monogram "TP" with Pilot Wing Curve -->
  <g filter="url(#glow)">
    <path d="M 20 22 L 36 22 M 28 22 L 28 44" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 36 22 C 43 22 47 26 47 31 C 47 36 43 40 36 40 L 36 22 Z" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ascending trend arrow / pilot tip -->
    <path d="M 42 16 L 50 16 L 50 24 M 50 16 L 36 30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
